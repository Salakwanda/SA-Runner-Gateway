services:
  - type: web
    name: sa-runner-gateway
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      - key: DATABASE_PATH
        value: /var/data/errands.db
      - key: SRG_SECRET
        generateValue: true
    disk:
      name: sa-runner-data
      mountPath: /var/data
      sizeGB: 1
